<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AE Inpaint</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="topbar">
        <nav class="tabs" role="tablist">
            <button class="tab active" data-tab="fill" role="tab">Fill</button>
            <button class="tab" data-tab="upscale" role="tab">Upscale</button>
        </nav>
        <div class="server" id="server-status" title="Local AI server">
            <span class="server-dot"></span>
            <span class="server-text" id="server-text">Idle</span>
        </div>
    </header>

    <main>
        <!-- ========== Fill ========== -->
        <section class="tab-panel active" id="tab-fill" role="tabpanel">
            <div class="field">
                <div class="segmented" id="mode" role="radiogroup" aria-label="Mode">
                    <button data-value="remove" class="active">Remove</button>
                    <button data-value="ai">Generate</button>
                    <button data-value="clean">Classic</button>
                </div>
                <p class="hint" id="mode-hint"></p>
            </div>

            <div class="field gen-only">
                <textarea id="prompt" rows="3" placeholder="What should appear? Leave empty to continue the surroundings."></textarea>
            </div>

            <div class="action">
                <button id="btn-inpaint" class="btn primary">Remove</button>
                <button id="btn-stop" class="btn danger" hidden>Stop</button>
            </div>

            <div class="progress" id="fill-progress" hidden>
                <div class="progress-track"><div class="progress-bar"></div></div>
            </div>
            <p class="status" id="fill-status"></p>

            <details class="options" id="fill-options">
                <summary>Options</summary>
                <div class="grid">
                    <span class="label">Mask expand</span>
                    <span class="hot" id="expand" data-min="0" data-max="50" data-default="3" data-unit=" px"
                          title="Grow the mask so antialiased edges of the object are covered too"></span>

                    <span class="label">Feather</span>
                    <span class="hot" id="feather" data-min="0" data-max="50" data-default="0" data-unit=" px"
                          title="Soft blend outside the mask edge"></span>

                    <span class="label gen-only">Steps</span>
                    <span class="hot gen-only" id="steps" data-min="1" data-max="50" data-default="" data-empty="Auto"
                          title="Empty = engine default (4 for FLUX.2 klein)"></span>

                    <span class="label gen-only">Guidance</span>
                    <span class="hot gen-only" id="guidance" data-min="0" data-max="50" data-step="0.5" data-default="" data-empty="Auto"
                          title="Empty = engine default. FLUX.2 klein ignores it"></span>

                    <span class="label gen-only">Strength</span>
                    <span class="hot gen-only" id="strength" data-min="0.05" data-max="1" data-step="0.05" data-default="1"
                          title="1 = repaint fully. Lower keeps more of the original under the mask"></span>

                    <span class="label gen-only">Seed</span>
                    <span class="hot gen-only" id="seed" data-min="0" data-max="999999999" data-default="" data-empty="Random"
                          title="Same seed = same result. Empty = random"></span>
                </div>
                <label class="check" title="Fill everything except the mask"><input type="checkbox" id="invert-mask"> Invert mask</label>
                <label class="check"><input type="checkbox" id="fill-transparent" checked> Fill transparent areas</label>
            </details>
        </section>

        <!-- ========== Upscale ========== -->
        <section class="tab-panel" id="tab-upscale" role="tabpanel">
            <div class="field row">
                <span class="label">Scale</span>
                <div class="segmented" id="scale" role="radiogroup" aria-label="Scale">
                    <button data-value="2">2×</button>
                    <button data-value="4" class="active">4×</button>
                </div>
            </div>
            <div class="field row">
                <span class="label">Model</span>
                <div class="segmented" id="upscale-model" role="radiogroup" aria-label="Model">
                    <button data-value="anime" class="active">Art</button>
                    <button data-value="general">Photo</button>
                </div>
            </div>
            <p class="hint">Every selected layer gets an upscaled copy above it, scaled to keep the same framing.</p>

            <div class="action">
                <button id="btn-upscale" class="btn primary">Upscale selected</button>
                <button id="btn-upscale-stop" class="btn danger" hidden>Stop</button>
            </div>
            <div class="progress" id="upscale-progress" hidden>
                <div class="progress-track"><div class="progress-bar"></div></div>
            </div>
            <p class="status" id="upscale-status"></p>
        </section>
    </main>

    <footer>
        <details class="activity" id="activity">
            <summary>Activity</summary>
            <ol id="log"></ol>
        </details>
        <div id="dev-tools" hidden>
            <button id="btn-debug-mode" class="btn small">CEP Debug: OFF</button>
        </div>
    </footer>

    <!-- First run: model download notice -->
    <div class="modal-backdrop" id="first-run-modal" hidden>
        <div class="modal" role="dialog" aria-labelledby="first-run-title">
            <h2 id="first-run-title">Download the AI model?</h2>
            <p>Generate uses FLUX.2 klein 4B. About 16 GB is downloaded once; it can take a while.</p>
            <div class="modal-actions">
                <button id="btn-first-run-cancel" class="btn">Not now</button>
                <button id="btn-first-run-continue" class="btn primary">Download</button>
            </div>
        </div>
    </div>

    <script src="js/CSInterface.js"></script>
    <script src="js/files.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
