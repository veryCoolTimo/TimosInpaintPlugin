<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AE Inpaint</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>AI Tools</h1>
            <div class="status-indicator" id="status-indicator">
                <span class="status-dot"></span>
                <span id="status-text">Offline</span>
            </div>
        </div>

        <!-- Tab Navigation -->
        <div class="tabs">
            <button class="tab active" data-tab="fill"><span>Fill</span></button>
            <button class="tab" data-tab="upscale"><span>Upscale</span></button>
        </div>

        <!-- ========== Fill Tab ========== -->
        <div class="tab-content active" id="tab-fill">
            <!-- Mode Selector -->
            <div class="section">
                <div class="mode-selector">
                    <label class="mode-option active">
                        <input type="radio" name="mode" value="remove" checked>
                        <span>Remove</span>
                    </label>
                    <label class="mode-option">
                        <input type="radio" name="mode" value="ai">
                        <span>AI Gen</span>
                    </label>
                    <label class="mode-option">
                        <input type="radio" name="mode" value="clean">
                        <span>Classic</span>
                    </label>
                </div>
            </div>

            <!-- Prompt (AI only) -->
            <div class="section ai-only" id="section-prompt">
                <label>Prompt</label>
                <textarea id="prompt" placeholder="Describe what should appear..."></textarea>
            </div>

            <!-- Negative Prompt (AI only) -->
            <div class="section ai-only" id="section-negative">
                <label>Negative</label>
                <textarea id="negative-prompt" placeholder="What to avoid...">person, human, character, face, body, animal, text, watermark, blurry</textarea>
            </div>

            <!-- Main Action -->
            <div class="section">
                <div class="btn-row">
                    <button id="btn-inpaint" class="btn btn-primary btn-large">
                        Inpaint
                    </button>
                    <button id="btn-stop" class="btn btn-danger hidden">
                        Stop
                    </button>
                </div>
            </div>

            <!-- Settings Toggle -->
            <div class="section">
                <button id="btn-toggle-settings" class="btn btn-secondary btn-small">
                    Settings
                </button>
            </div>

            <!-- Settings Panel -->
            <div class="section settings-panel hidden" id="settings-panel">
                <!-- AI Settings -->
                <div class="ai-only">
                    <div class="setting">
                        <div class="setting-label">
                            <label>Strength<span class="tooltip" tabindex="0" data-tip="1.0 = full regeneration (object removal). Lower = preserve more original">?</span></label>
                            <span class="value" id="strength-value">1.0</span>
                        </div>
                        <input type="range" id="strength" min="0.3" max="1.0" step="0.05" value="1.0">
                    </div>

                    <div class="setting">
                        <div class="setting-label">
                            <label>Guidance<span class="tooltip" tabindex="0" data-tip="How closely to follow prompt">?</span></label>
                            <span class="value" id="guidance-value">7.5</span>
                        </div>
                        <input type="range" id="guidance" min="1" max="15" step="0.5" value="7.5">
                    </div>

                    <div class="setting">
                        <div class="setting-label">
                            <label>Steps<span class="tooltip" tabindex="0" data-tip="More = better quality, slower">?</span></label>
                            <span class="value" id="steps-value">20</span>
                        </div>
                        <input type="range" id="steps" min="10" max="50" step="1" value="20">
                    </div>

                    <div class="setting">
                        <div class="setting-label">
                            <label>Seed<span class="tooltip" tabindex="0" data-tip="Same seed = same result">?</span></label>
                        </div>
                        <input type="number" id="seed" min="-1" max="999999999" value="-1" class="input-small">
                    </div>

                    <div class="divider"></div>
                </div>

                <!-- Mask Settings -->
                <div class="setting">
                    <label class="checkbox-label">
                        <input type="checkbox" id="invert-mask">
                        <span>Invert mask<span class="tooltip" tabindex="0" data-tip="Swap what counts as masked vs kept. Turn this on if the wrong area gets filled.">?</span></span>
                    </label>
                </div>

                <div class="setting">
                    <label class="checkbox-label">
                        <input type="checkbox" id="crop-to-mask" checked>
                        <span>Crop to mask<span class="tooltip" tabindex="0" data-tip="Faster processing">?</span></span>
                    </label>
                </div>

                <div class="setting">
                    <label class="checkbox-label">
                        <input type="checkbox" id="fill-transparent">
                        <span>Fill transparent<span class="tooltip" tabindex="0" data-tip="Keep generated content in transparent areas under mask">?</span></span>
                    </label>
                </div>

                <div class="setting">
                    <div class="setting-label">
                        <label>Feather<span class="tooltip" tabindex="0" data-tip="Blur mask edges">?</span></label>
                        <span class="value" id="feather-value">0</span>
                    </div>
                    <input type="range" id="feather" min="0" max="50" step="1" value="0">
                </div>

                <div class="setting">
                    <div class="setting-label">
                        <label>Expand<span class="tooltip" tabindex="0" data-tip="Grow mask area">?</span></label>
                        <span class="value" id="expand-value">0</span>
                    </div>
                    <input type="range" id="expand" min="0" max="50" step="1" value="0">
                </div>
            </div>
        </div>

        <!-- ========== Upscale Tab ========== -->
        <div class="tab-content" id="tab-upscale">
            <!-- Scale Selector -->
            <div class="section">
                <label>Scale</label>
                <div class="scale-selector">
                    <label class="scale-option">
                        <input type="radio" name="scale" value="2">
                        <span>x2</span>
                    </label>
                    <label class="scale-option active">
                        <input type="radio" name="scale" value="4" checked>
                        <span>x4</span>
                    </label>
                </div>
            </div>

            <!-- Model Type Selector -->
            <div class="section">
                <label>Model</label>
                <div class="mode-selector">
                    <label class="mode-option active">
                        <input type="radio" name="upscale-model" value="anime" checked>
                        <span>Anime</span>
                    </label>
                    <label class="mode-option">
                        <input type="radio" name="upscale-model" value="general">
                        <span>General</span>
                    </label>
                </div>
            </div>

            <!-- Main Action -->
            <div class="section">
                <button id="btn-upscale" class="btn btn-primary btn-large">
                    Upscale
                </button>
            </div>

            <!-- Info -->
            <div class="section">
                <p class="section-title" style="text-align: center; color: var(--text-tertiary); font-size: 11px;">
                    Real-ESRGAN upscaling. Anime model optimized for manga/manhwa.
                </p>
            </div>
        </div>

        <!-- Log -->
        <div class="section">
            <div class="log-container">
                <div id="log"></div>
            </div>
        </div>

        <!-- Dev Tools (hidden) -->
        <div class="section hidden" id="dev-tools">
            <button id="btn-debug-mode" class="btn btn-secondary btn-small">CEP Debug: OFF</button>
        </div>
    </div>

    <!-- Progress Overlay -->
    <div id="progress-overlay" class="overlay hidden">
        <div class="progress-container">
            <div class="spinner"></div>
            <div id="progress-text">Processing...</div>
            <div id="progress-detail" class="progress-detail"></div>
            <button id="btn-stop-overlay" class="btn btn-secondary btn-small hidden">Cancel</button>
        </div>
    </div>

    <!-- First Run Modal -->
    <div id="first-run-modal" class="overlay hidden">
        <div class="modal">
            <h3>First Run</h3>
            <p>The AI model will be downloaded (size varies by mode — several GB up to ~10GB for AI Gen). This may take a while depending on your connection.</p>
            <div class="modal-buttons">
                <button id="btn-first-run-cancel" class="btn btn-secondary">Cancel</button>
                <button id="btn-first-run-continue" class="btn btn-primary">Continue</button>
            </div>
        </div>
    </div>

    <script src="js/CSInterface.js"></script>
    <script src="js/files.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
